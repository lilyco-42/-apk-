name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          # ubuntu-latest 自带 Android SDK，直接用它，避免 setup-android
          # 去装已废弃的 'tools' 包导致失败
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          ls "$ANDROID_SDK_ROOT" || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version || true

      - name: Write local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          MAPS_SAFE_CODE: ${{ secrets.MAPS_SAFE_CODE }}
        run: |
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "MAPS_API_KEY=$MAPS_API_KEY"
            echo "MAPS_SAFE_CODE=$MAPS_SAFE_CODE"
          } > local.properties
          # 只打印长度，避免 AK 泄漏到日志
          echo "MAPS_API_KEY length: ${#MAPS_API_KEY}"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 未配置，将产出未签名包"
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/PaDouBuPao.jks
          {
            echo "STORE_FILE=keystore/PaDouBuPao.jks"
            echo "STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > signing.properties

      - name: Build release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      # 产物名带中文（跑都不跑_vX.Y.Z_...apk），下载链接里不好用，
      # 统一复制成 ASCII 名再发布，update.json 里的 download_url 依赖这个名字。
      - name: Normalize APK name
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/PaDouBuPao_arm64-v8a_release.apk
          ls -l dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: dist/*.apk
          if-no-files-found: error

      # 推 v* 标签时把签名包直接发到 Release：
      # App 内置更新检查（GiteeReleaseChecker）读的是 releases/latest，
      # 只上传 artifact 的话普通用户拿不到下载链接。
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          name: 跑都不跑 ${{ github.ref_name }}
          body_path: update.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
